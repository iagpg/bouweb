<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Página não encontrada — Bouwobra</title>
    <style>
      body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif;margin:0;background:#0f1724;color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh}
      .container{max-width:900px;padding:32px;text-align:left}
      h1{font-size:48px;margin:0 0 12px;text-transform:uppercase}
      p{color:#cbd5e1;margin:12px 0 20px}
      .actions{display:flex;gap:12px}
      a.btn{display:inline-block;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:700}
      a.primary{background:#ffaf2c;color:#071025}
      a.ghost{border:1px solid rgba(255,175,44,0.25);color:#ffaf2c}
    </style>
  </head>
  <body>
    <main class="container">
      <p style="letter-spacing:0.22em;color:#ffd8a6;font-weight:800">Erro 404</p>
      <h1>Página não encontrada</h1>
      <p>O endereço pode ter mudado ou não existe mais. Volte para uma área ativa do site e continue navegando.</p>
      <div class="actions">
        <a class="btn primary" href="/">Voltar para Home</a>
        <a class="btn ghost" href="/contact">Falar com equipe</a>
      </div>
    </main>
  </body>
</html>
